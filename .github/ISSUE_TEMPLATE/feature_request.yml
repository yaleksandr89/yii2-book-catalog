name: Feature request / Предложить улучшение
description: Suggest an improvement that fits the Yii2 Book Catalog scope / Предложить улучшение, соответствующее назначению Yii2 Book Catalog
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first and the expected behavior. Large changes should be discussed in an Issue before implementation. / Сначала опишите пользовательскую проблему и ожидаемое поведение. Крупные изменения следует обсудить в Issue до реализации.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / Проблема или сценарий использования
      description: What problem are you trying to solve, and who encounters it? / Какую задачу вы хотите решить и кто с ней сталкивается?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Предлагаемое поведение
      description: What should change from the user's point of view? / Что должно измениться с точки зрения пользователя?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Альтернативы
      description: What alternatives or workarounds have you considered? / Какие варианты или обходные пути уже рассматривались?

  - type: textarea
    id: scope
    attributes:
      label: Affected scope / Границы задачи
      description: Note whether the proposal affects UI, database schema, documentation, uploads, SMSPilot, or another integration. / Укажите, влияет ли предложение на интерфейс, схему БД, документацию, uploads, SMSPilot или другую интеграцию.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / Подтверждение
      options:
        - label: I searched existing Issues for the same request. / Я проверил(а) существующие Issues на наличие такого запроса.
          required: true
