name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docker / PHP 8.5 / MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare environment
        run: make init

      - name: Validate Docker Compose config
        run: make config

      - name: Build application image
        run: make build

      - name: Start services
        run: make up

      - name: Install locked Composer dependencies
        run: make composer-install

      - name: Apply development migrations
        run: make migrate

      - name: Prepare test database
        run: |
          make test-db-init
          make test-db-migrate

      - name: Run quality checks
        run: make check

      - name: Run PHPUnit with coverage
        run: make coverage

      - name: Run application smoke checks
        run: |
          make db-check
          make smoke

      - name: Stop services
        if: always()
        run: |
          if [ -f .env.docker ]; then
            make down
          fi
